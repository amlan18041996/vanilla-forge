<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    Vanilla Forge icon sprite.

    Conventions:
    - One <symbol> per icon, id = "icon-<kebab-case-name>".
    - 24x24 viewBox for UI icons (brand marks may differ).
    - Monochrome icons use currentColor so CSS controls the colour.
    - Outline icons: fill="none", stroke="currentColor", round caps/joins.
    - Filled icons (brand marks): fill="currentColor", stroke="none".

    Sources: Lucide (ISC), Simple Icons (CC0), in-house brand mark.
    Add new icons here, then reference them with <use href="#icon-name">.
  -->
