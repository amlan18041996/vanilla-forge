      <linearGradient id="logo-grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#6366f1"/>
        <stop offset="100%" stop-color="#06b6d4"/>
      </linearGradient>
    </defs>
    <rect width="40" height="40" rx="10" fill="url(#logo-grad)"/>
    <path d="M10 30 L20 12 L30 30" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 7 L21.5 10 L24 11 L21.5 12 L20 15 L18.5 12 L16 11 L18.5 10 Z" fill="white"/>
